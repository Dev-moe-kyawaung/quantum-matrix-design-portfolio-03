    <script>
      // Prevent theme flash: apply saved mode + accent before paint
      try {
        var t = localStorage.getItem("mka-theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        var a = localStorage.getItem("mka-accent");
        if (a) document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
